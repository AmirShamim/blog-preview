<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>
  <main class="flex justify-center items-center">
    <div class="container flex flex-col gap-min">
      <img class="illustration-image" src="./assets/images/illustration-article.svg" alt="">
      <p class="yellow-padded bold text-xs dark-text">
        Learning
      </p>
      <p class="semibold dark-text text-xs">
        Published 21 Dec 2023
      </p>
      <h3 class="bold dark-text text-med">
        HTML & CSS foundations
      </h3>
      <p class="semibold text-xs faded-text">
        These languages are the backbone of every website, defining structure, content, and presentation.
      </p>
      <div class="flex flex-row items-center">
        <img class="avatar-image" src="./assets/images/image-avatar.webp" alt="">
        <p class="dark-text bold text-xs">
          Greg Hooper
        </p>
      </div>
    </div>
  </main>
  <div class="attribution">
    <p>
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    </p>
    <p>
      Coded by <a href="https://github.com/AmirShamim">AmirShamim</a>
    </p>
  </div>
</body>

</html>
